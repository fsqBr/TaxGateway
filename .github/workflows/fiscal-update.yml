# Pipeline de atualização fiscal (SDD §2.3; D-401 a D-403).
# Diário: detecta tag nova dos motores da RFB → constrói as imagens candidatas → contrato (OpenAPI) → testes
# oficiais → relatório de regressão do corpus golden (atual × candidato) → abre PR com o relatório.
# O PR não faz deploy: o merge dispara o deploy.yml (staging → aprovação manual → canário).
name: fiscal-update

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read
  actions: write   # D-R38: disparar o CI no PR e na main (o GITHUB_TOKEN só dispara workflow por workflow_dispatch)

jobs:
  detect-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      bundle: ${{ steps.detect.outputs.bundle }}
      retag: ${{ steps.detect.outputs.retag }}
      pr: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detectar tags novas
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp infra/rfb/versions.json /tmp/versions.atual.json
          python3 infra/rfb/check_tags.py --write | tee /tmp/check.json
          echo "changed=$(python3 -c 'import json;print(str(json.load(open("/tmp/check.json"))["changed"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "bundle=$(python3 -c 'import json;print(json.load(open("/tmp/check.json"))["bundle"])')" >> "$GITHUB_OUTPUT"
          echo "retag=$(python3 -c 'import json;print(str(any(u.get("kind") == "retag" for u in json.load(open("/tmp/check.json")).get("updates", {}).values())).lower())')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.detect.outputs.changed == 'true'

      - name: Imagens candidatas (bundle novo)
        if: steps.detect.outputs.changed == 'true'
        run: bash infra/rfb/build.sh candidate

      - name: Imagens atuais (bundle em produção)
        if: steps.detect.outputs.changed == 'true'
        run: |
          cp infra/rfb/versions.json /tmp/versions.candidato.json
          cp /tmp/versions.atual.json infra/rfb/versions.json
          bash infra/rfb/build.sh atual
          cp /tmp/versions.candidato.json infra/rfb/versions.json

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.detect.outputs.changed == 'true'
        with:
          global-json-file: global.json

      - name: Testes de contrato no candidato
        if: steps.detect.outputs.changed == 'true'
        env:
          RTC_IMAGE_PREFIX: candidate
        run: dotnet test tests/TaxGateway.ContractTests -c Release

      - name: Testes oficiais do candidato
        if: steps.detect.outputs.changed == 'true'
        run: |
          bash infra/rfb/test-engines.sh regular out/engine-tests/regular
          bash infra/rfb/test-engines.sh simples out/engine-tests/simples

      - name: Relatório de regressão (corpus golden, atual × candidato)
        if: steps.detect.outputs.changed == 'true'
        run: |
          atual_tag=$(python3 -c 'import json;print(json.load(open("/tmp/versions.atual.json"))["regular"]["tag"])')
          novo_tag=$(python3 -c 'import json;print(json.load(open("infra/rfb/versions.json"))["regular"]["tag"])')
          docker run -d --name atual --read-only --tmpfs /tmp:exec -e VERSAO_OFFLINE_URL=http://127.0.0.1:9/disabled -p 18080:8080 "atual/rtc-regular:${atual_tag}"
          docker run -d --name novo --read-only --tmpfs /tmp:exec -e VERSAO_OFFLINE_URL=http://127.0.0.1:9/disabled -p 28080:8080 "candidate/rtc-regular:${novo_tag}"
          for _ in $(seq 1 90); do
            curl -fs http://127.0.0.1:18080/api/api-docs >/dev/null && curl -fs http://127.0.0.1:28080/api/api-docs >/dev/null && break
            sleep 2
          done
          # D-R31: o resumo vai junto no PR e vira o texto do aviso "motor oficial atualizado" às contas.
          python3 infra/rfb/regression_report.py --base http://127.0.0.1:18080/api/ --candidate http://127.0.0.1:28080/api/ --out out/regressao.md             --bundle "${{ steps.detect.outputs.bundle }}" --summary-json "src/TaxGateway.Workers/fiscal-bundles/${{ steps.detect.outputs.bundle }}.json"
          cat out/regressao.md >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo da detecção no topo do relatório (nova versão ou tag republicada, D-Q04)
        if: steps.detect.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import json
          c = json.load(open("/tmp/check.json"))
          lines = ["## O que mudou nos motores", ""]
          for engine, u in c["updates"].items():
              if u.get("kind") == "retag":
                  lines.append(f"* **{engine}: a RFB republicou a tag `{u['to']}`** em outro commit "
                               f"(`{u['commit_anterior'][:12]}` → `{u['commit'][:12]}`). Mesma versão, código diferente: revisar o diff.")
              else:
                  lines.append(f"* **{engine}:** `{u['from']}` → `{u['to']}` (commit `{u['commit'][:12]}`).")
          for w in c.get("warnings", []):
              lines.append(f"* Aviso: {w}")
          body = open("out/regressao.md", encoding="utf-8").read()
          open("out/regressao.md", "w", encoding="utf-8").write("\n".join(lines) + "\n\n" + body)
          PY

      - name: Abrir PR com o relatório
        id: pr
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: fiscal/bundle-${{ steps.detect.outputs.bundle }}
          title: "Bundle fiscal ${{ steps.detect.outputs.bundle }}"
          commit-message: "Atualiza motores da RFB para o bundle ${{ steps.detect.outputs.bundle }}"
          add-paths: |
            infra/rfb/versions.json
            src/TaxGateway.Workers/fiscal-bundles/*.json
          body-path: out/regressao.md
          labels: fiscal, requer-aprovacao-fiscal

  # D-R38: merge automático SEGURO do bundle novo (variável do repositório FISCAL_AUTO_MERGE=true). Sem token pessoal:
  #  1. dispara o CI completo no commit do PR (workflow_dispatch é o único evento que o GITHUB_TOKEN pode disparar);
  #  2. só faz o merge se o CI daquele commit terminar VERDE (contrato e testes oficiais já passaram no job anterior);
  #  3. roda o CI na main depois do merge e, com DEPLOY_ENABLED=true, dispara o deploy — staging automático e
  #     produção só com a aprovação do ambiente "production" (canário com rollback automático).
  # Tag republicada pela RFB no mesmo número (retag) NÃO entra sozinha: código diferente na mesma versão pede revisão.
  # Qualquer falha deixa o PR aberto com um comentário dizendo o motivo — nada vai para a main sem CI verde.
  auto-merge:
    needs: detect-and-validate
    if: >-
      needs.detect-and-validate.outputs.changed == 'true' && vars.FISCAL_AUTO_MERGE == 'true' &&
      needs.detect-and-validate.outputs.retag != 'true' && needs.detect-and-validate.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.detect-and-validate.outputs.pr }}
      BRANCH: fiscal/bundle-${{ needs.detect-and-validate.outputs.bundle }}
    steps:
      - name: CI completo no commit do PR
        id: ci_pr
        run: |
          sha=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "$BRANCH"
          export SHA="$sha"; id=""
          for _ in $(seq 1 60); do
            id=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --json databaseId,headSha -q '[.[] | select(.headSha == env.SHA)][0].databaseId')
            [ -n "$id" ] && break; sleep 10
          done
          [ -n "$id" ] || { echo "CI não iniciou"; exit 1; }
          echo "$id" > /tmp/run
          gh run watch "$(cat /tmp/run)" --exit-status --interval 60

      - name: Merge (só com o CI verde e o PR sem mudança desde o teste)
        run: |
          now=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          [ "$now" = "${{ steps.ci_pr.outputs.sha }}" ] || { echo "PR mudou depois do CI"; exit 1; }
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$now"

      - name: CI na main e deploy
        run: |
          main=$(gh api "repos/$GH_REPO/commits/main" -q .sha)
          gh workflow run ci.yml --ref main
          export SHA="$main"; id=""
          for _ in $(seq 1 60); do
            id=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --json databaseId,headSha -q '[.[] | select(.headSha == env.SHA)][0].databaseId')
            [ -n "$id" ] && break; sleep 10
          done
          [ -n "$id" ] || { echo "CI não iniciou"; exit 1; }
          echo "$id" > /tmp/run
          gh run watch "$(cat /tmp/run)" --exit-status --interval 60
          if [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then gh workflow run deploy.yml --ref main; else echo "DEPLOY_ENABLED desligado: deploy fica manual."; fi

      - name: Avisar no PR quando o merge automático não aconteceu
        if: failure()
        run: gh pr comment "$PR" --body "Merge automático cancelado (CI vermelho, PR alterado ou falha no CI da main). O PR fica aberto para revisão — nada foi para a main sem CI verde." || true
