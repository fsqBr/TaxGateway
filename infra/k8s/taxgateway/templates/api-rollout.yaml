# API PÚBLICA com os DOIS motores como sidecars (regular e Simples; SDD §16.2 item 1: chamada em localhost) e canário
# (§2.3 passo 6). Sem rotas administrativas: o Secret dela não tem ConnectionStrings__Admin (D-P29, ver api-admin.yaml).
# Tráfego (D-P02): o nginx do site usa o Service "api-all" (todos os pods, estáveis e canário). Sem traffic routing, o
# Argo divide por réplicas: com N réplicas o menor passo real é 1/N (com 3, ~33%). Com api.ingress.enabled, o Ingress
# da API usa o traffic routing do nginx e o peso vale exato. A análise só conclui com volume mínimo no canário.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  labels: {{- include "tg.labels" . | nindent 4 }}
    app.kubernetes.io/name: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  strategy:
    canary:
      stableService: api
      canaryService: api-canary
      {{- if .Values.api.ingress.enabled }}
      trafficRouting:
        nginx: { stableIngress: api }
      {{- end }}
      analysis:
        templates: [{ templateName: api-slo }]
        startingStep: 1
      steps:
        {{- range $i, $w := .Values.api.canary.steps }}
        - setWeight: {{ $w }}
        - pause: { duration: {{ $.Values.api.canary.pauseMinutes }}m }
        {{- end }}
  template:
    metadata:
      labels: {{- include "tg.labels" . | nindent 8 }}
        app.kubernetes.io/name: api
        taxgateway/engine-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 10001 }
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      # Motores como sidecars nativos (D-P25): prontos antes da API, encerrados depois dela.
      initContainers:
        {{- include "tg.engine" (dict "root" . "name" "regular" "e" .Values.engines.regular "sidecar" true) | nindent 8 }}
        {{- include "tg.engine" (dict "root" . "name" "simples" "e" .Values.engines.simples "sidecar" true) | nindent 8 }}
      containers:
        {{- include "tg.apiContainer" (dict "root" . "secret" .Values.secrets.api "resources" .Values.api.resources
              "regular" (printf "http://127.0.0.1:%v/api/" .Values.engines.regular.port)
              "simples" (printf "http://127.0.0.1:%v/api/" .Values.engines.simples.port)) | nindent 8 }}
      volumes:
        - { name: tmp-api, emptyDir: { sizeLimit: 2Gi } }   # upload do lote (modo 1) vai para arquivo temporário (D-606)
        - { name: tmp-regular, emptyDir: { sizeLimit: 256Mi } }
        - { name: tmp-simples, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "tg.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 80, targetPort: http }, { name: metrics, port: {{ .Values.api.metricsPort }}, targetPort: metrics }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  labels: {{- include "tg.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 80, targetPort: http }, { name: metrics, port: {{ .Values.api.metricsPort }}, targetPort: metrics }]
---
# Todos os pods da API (estáveis + canário). Upstream do nginx do site/backoffice; sem porta "metrics" para não
# duplicar a coleta (D-P02).
apiVersion: v1
kind: Service
metadata:
  name: api-all
  labels: {{- include "tg.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels: {{- include "tg.labels" . | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.web.ingressClassName }}
  tls: [{ hosts: [{{ .Values.api.ingress.host | quote }}], secretName: {{ .Values.api.ingress.tlsSecret }} }]
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-slo
  labels: {{- include "tg.labels" . | nindent 4 }}
spec:
  # Sem volume mínimo no canário o resultado vem vazio: nem sucesso nem falha = inconclusivo, e o rollout PAUSA para
  # decisão humana (antes, vetor vazio abortava ou passava no vazio). D-P02.
  metrics:
    - name: error-rate
      interval: 1m
      failureLimit: 2
      inconclusiveLimit: 3
      successCondition: "len(result) > 0 && result[0] <= {{ .Values.api.canary.maxErrorRate }}"
      failureCondition: "len(result) > 0 && result[0] > {{ .Values.api.canary.maxErrorRate }}"
      provider:
        prometheus:
          address: {{ .Values.prometheus.address }}
          query: |
            (
              sum(rate(http_server_request_duration_seconds_count{service="api-canary",http_response_status_code=~"5.."}[5m]))
              / sum(rate(http_server_request_duration_seconds_count{service="api-canary"}[5m]))
            ) and on() (sum(rate(http_server_request_duration_seconds_count{service="api-canary"}[5m])) >= {{ .Values.api.canary.minRps }})
    - name: p95-latency
      interval: 1m
      failureLimit: 2
      inconclusiveLimit: 3
      successCondition: "len(result) > 0 && result[0] <= {{ .Values.api.canary.maxP95Seconds }}"
      failureCondition: "len(result) > 0 && result[0] > {{ .Values.api.canary.maxP95Seconds }}"
      provider:
        prometheus:
          address: {{ .Values.prometheus.address }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service="api-canary",http_route="/v1/calculo/simular"}[5m])))
            and on() (sum(rate(http_server_request_duration_seconds_count{service="api-canary",http_route="/v1/calculo/simular"}[5m])) >= {{ .Values.api.canary.minRps }})
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels: {{- include "tg.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: api }
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.cpuTarget }} } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api }
